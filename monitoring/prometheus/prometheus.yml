global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: trade-executor
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [trade-executor:8081]

  - job_name: accounts-service
    metrics_path: /api/actuator/prometheus
    static_configs:
      - targets: [accounts-service:8081]

  - job_name: instruments-service
    metrics_path: /api/actuator/prometheus
    static_configs:
      - targets: [instruments-service:8081]

  - job_name: orders-service
    metrics_path: /api/actuator/prometheus
    static_configs:
      - targets: [orders-service:8081]

  - job_name: positions-service
    metrics_path: /api/actuator/prometheus
    static_configs:
      - targets: [positions-service:8081]

  - job_name: auth-service
    metrics_path: /metrics
    static_configs:
      - targets: [auth-service:8081]

  - job_name: frontend
    static_configs:
      - targets: [nginx-exporter:9113]
