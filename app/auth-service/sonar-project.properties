sonar.projectKey=theunderfrogs-auth-service
sonar.projectName=Auth Service
sonar.sourceEncoding=UTF-8

# Production code lives in src, alongside its specs, so specs are excluded here and counted as tests below.
sonar.sources=src
sonar.exclusions=**/*.spec.ts,**/__tests__/**
sonar.tests=src,test
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts

# Bootstrap and module wiring, which unit tests don't exercise.
sonar.coverage.exclusions=src/main.ts,**/*.module.ts

# Written by `npm run test:cov`.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# SonarQube 9.9 bundles an older TypeScript that rejects options in tsconfig.json, so it gets its own.
sonar.typescript.tsconfigPaths=tsconfig.sonar.json
