openapi: 3.0.0
info:
  title: Accounts Service API
  description: Microservice for account management and financial operations
  version: 1.0.0
  contact:
    name: Neueda LEAP Team
    url: https://github.com/neueda/leap
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: https://accounts-service.example.com
    description: Production Server
  - url: http://localhost:8081
    description: Local Development Server

tags:
  - name: Accounts
    description: Account management operations
  - name: Credit Operations
    description: Account credit operations
  - name: Debit Operations
    description: Account debit operations

paths:
  /accounts:
    post:
      tags:
        - Accounts
      summary: Create a new account
      description: Creates a new account with the provided details
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
            examples:
              success:
                summary: Valid account creation
                value:
                  accountId: "ACC001"
                  holderName: "John Doe"
                  cashBalance: 5000.00
                  status: "ACTIVE"
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              examples:
                success:
                  summary: Successfully created account
                  value:
                    accountId: "ACC001"
                    holderName: "John Doe"
                    cashBalance: 5000
                    status: "ACTIVE"
                    version: 1
                    createdAt: "2026-09-22T10:30:00Z"
                    lastUpdated: "2026-09-22T10:30:00Z"
        '422':
          description: Unprocessable Entity - Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingField:
                  summary: Missing required field
                  value:
                    errorCode: "VAL-422"
                    message: "Account ID cannot be null or blank"
                invalidData:
                  summary: Invalid data format
                  value:
                    errorCode: "VAL-422"
                    message: "Holder name cannot be null or blank"

  /accounts/{accountId}:
    get:
      tags:
        - Accounts
      summary: Retrieve an account by ID
      description: Fetches account details using the account ID
      operationId: getAccount
      parameters:
        - name: accountId
          in: path
          required: true
          description: The unique identifier of the account
          schema:
            type: string
            example: "ACC001"
      responses:
        '200':
          description: Account retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              examples:
                success:
                  summary: Account found
                  value:
                    accountId: "ACC001"
                    holderName: "John Doe"
                    cashBalance: 5000
                    status: "ACTIVE"
                    version: 1
                    createdAt: "2026-09-22T10:30:00Z"
                    lastUpdated: "2026-09-22T10:30:00Z"
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  summary: Account does not exist
                  value:
                    errorCode: "ACC-404"
                    message: "Account not found: ACC001"

    put:
      tags:
        - Accounts
      summary: Update an account
      description: Updates account details (holder name and/or status)
      operationId: updateAccount
      parameters:
        - name: accountId
          in: path
          required: true
          description: The unique identifier of the account
          schema:
            type: string
            example: "ACC001"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
            examples:
              updateName:
                summary: Update holder name
                value:
                  holderName: "Jane Smith"
              updateStatus:
                summary: Update account status
                value:
                  status: "SUSPENDED"
      responses:
        '200':
          description: Account updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              examples:
                success:
                  summary: Successfully updated account
                  value:
                    accountId: "ACC001"
                    holderName: "Jane Smith"
                    cashBalance: 5000
                    status: "ACTIVE"
                    version: 2
                    createdAt: "2026-09-22T10:30:00Z"
                    lastUpdated: "2026-09-22T10:45:00Z"
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  summary: Account does not exist
                  value:
                    errorCode: "ACC-404"
                    message: "Account not found: ACC001"
        '422':
          description: Unprocessable Entity - Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidData:
                  summary: Invalid holder name
                  value:
                    errorCode: "VAL-422"
                    message: "Holder name cannot be null or blank"

    delete:
      tags:
        - Accounts
      summary: Delete an account
      description: Deletes an account and all associated data
      operationId: deleteAccount
      parameters:
        - name: accountId
          in: path
          required: true
          description: The unique identifier of the account
          schema:
            type: string
            example: "ACC001"
      responses:
        '204':
          description: Account deleted successfully
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  summary: Account does not exist
                  value:
                    errorCode: "ACC-404"
                    message: "Account not found: ACC001"

  /accounts/{accountId}/credit:
    post:
      tags:
        - Credit Operations
      summary: Credit an account
      description: >
        Service only: needs a token with the SERVICE role (the trade-executor); a user token gets 403.
        Users add cash with a top-up instead.
        Adds funds to an active account's cash balance.
        When an orderId is sent, the credit is applied at most once for that order:
        a repeat call returns 200 with the current balance and changes nothing.
        Without an orderId, every call is applied.
      operationId: creditAccount
      parameters:
        - name: accountId
          in: path
          required: true
          description: The unique identifier of the account
          schema:
            type: string
            example: "ACC001"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditDebitRequest'
            examples:
              creditFunds:
                summary: Credit 1000 to account
                value:
                  amount: 1000.00
              creditForOrder:
                summary: Credit 1000 for an order (safe to repeat)
                value:
                  amount: 1000.00
                  orderId: "0adf7599-df9d-4176-93b6-3a555e54415d"
      responses:
        '200':
          description: Account credited successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              examples:
                success:
                  summary: Successfully credited account
                  value:
                    accountId: "ACC001"
                    holderName: "John Doe"
                    cashBalance: 6000
                    status: "ACTIVE"
                    version: 2
                    createdAt: "2026-09-22T10:30:00Z"
                    lastUpdated: "2026-09-22T10:50:00Z"
        '400':
          description: Bad Request - Insufficient funds or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                insufficientFunds:
                  summary: Insufficient funds in account
                  value:
                    errorCode: "ORD-400"
                    message: "Insufficient funds. Balance: 5000, Requested: 6000"
        '403':
          description: Forbidden - Account is not active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                accountInactive:
                  summary: Cannot credit inactive account
                  value:
                    errorCode: "ACC-403"
                    message: "Cannot credit an inactive account"
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  summary: Account does not exist
                  value:
                    errorCode: "ACC-404"
                    message: "Account not found: ACC001"
        '422':
          description: Unprocessable Entity - Invalid amount
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                negativeAmount:
                  summary: Amount cannot be negative or zero
                  value:
                    errorCode: "VAL-422"
                    message: "Credit amount must be positive"
                zeroAmount:
                  summary: Amount must be greater than zero
                  value:
                    errorCode: "VAL-422"
                    message: "Credit amount must be positive"

  /accounts/{accountId}/debit:
    post:
      tags:
        - Debit Operations
      summary: Debit an account
      description: >
        Service only: needs a token with the SERVICE role (the trade-executor); a user token gets 403.
        Withdraws funds from an active account's cash balance.
        When an orderId is sent, the debit is applied at most once for that order:
        a repeat call returns 200 with the current balance and changes nothing.
        Without an orderId, every call is applied.
      operationId: debitAccount
      parameters:
        - name: accountId
          in: path
          required: true
          description: The unique identifier of the account
          schema:
            type: string
            example: "ACC001"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditDebitRequest'
            examples:
              debitFunds:
                summary: Debit 1000 from account
                value:
                  amount: 1000.00
              debitForOrder:
                summary: Debit 1000 for an order (safe to repeat)
                value:
                  amount: 1000.00
                  orderId: "0adf7599-df9d-4176-93b6-3a555e54415d"
      responses:
        '200':
          description: Account debited successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              examples:
                success:
                  summary: Successfully debited account
                  value:
                    accountId: "ACC001"
                    holderName: "John Doe"
                    cashBalance: 4000
                    status: "ACTIVE"
                    version: 2
                    createdAt: "2026-09-22T10:30:00Z"
                    lastUpdated: "2026-09-22T10:55:00Z"
        '400':
          description: Bad Request - Insufficient funds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                insufficientFunds:
                  summary: Insufficient funds in account
                  value:
                    errorCode: "ORD-400"
                    message: "Insufficient funds. Balance: 3000, Requested: 5000"
        '403':
          description: Forbidden - Account is not active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                accountInactive:
                  summary: Cannot debit inactive account
                  value:
                    errorCode: "ACC-403"
                    message: "Cannot debit an inactive account"
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  summary: Account does not exist
                  value:
                    errorCode: "ACC-404"
                    message: "Account not found: ACC001"
        '422':
          description: Unprocessable Entity - Invalid amount
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                negativeAmount:
                  summary: Amount cannot be negative or zero
                  value:
                    errorCode: "VAL-422"
                    message: "Debit amount must be positive"
                zeroAmount:
                  summary: Amount must be greater than zero
                  value:
                    errorCode: "VAL-422"
                    message: "Debit amount must be positive"

  /accounts/{accountId}/reversal:
    post:
      tags:
        - Reversal Operations
      summary: Reverse an order's cash movement
      description: >
        Service only: needs a token with the SERVICE role (the trade-executor); a user token gets 403.
        Undoes the debit or credit recorded for the given orderId by applying the opposite amount.
        Applied at most once per order: a repeat call returns 200 with the current balance and changes nothing.
        If the order has no cash movement, nothing is changed and 200 is returned, so a saga can safely
        undo a step that never happened. Works on inactive accounts.
      operationId: reverseMovement
      parameters:
        - name: accountId
          in: path
          required: true
          description: The unique identifier of the account
          schema:
            type: string
            example: "ACC001"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReversalRequest'
            examples:
              reverseOrder:
                summary: Reverse the cash movement for an order
                value:
                  orderId: "0adf7599-df9d-4176-93b6-3a555e54415d"
      responses:
        '200':
          description: Movement reversed, already reversed, or nothing to reverse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: Bad Request - Reversing a credit would take the balance below zero
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                insufficientFunds:
                  summary: Not enough cash to reverse a credit
                  value:
                    errorCode: "ORD-400"
                    message: "Insufficient funds to reverse order 0adf7599-df9d-4176-93b6-3a555e54415d. Balance: 50.00"
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  summary: Account does not exist
                  value:
                    errorCode: "ACC-404"
                    message: "Account not found: ACC001"
        '422':
          description: Unprocessable Entity - Missing orderId, or the order belongs to a different account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                wrongAccount:
                  summary: Order belongs to another account
                  value:
                    errorCode: "VAL-422"
                    message: "Order 0adf7599-df9d-4176-93b6-3a555e54415d belongs to a different account"

  /accounts/{accountId}/top-ups:
    post:
      tags:
        - Top-ups
      summary: Start a Stripe top-up for your own account
      description: >
        Creates a Stripe Checkout session for a one-off USD payment of $10.00 to $10,000.00
        and returns the Stripe page to send the user to. Nothing is credited yet: Stripe sends
        the user back to /wallet/return, and the app then calls the confirm endpoint.
        returnTo must be an app path; anything else falls back to /dashboard.
      operationId: startTopUp
      parameters:
        - name: accountId
          in: path
          required: true
          description: Your own account ID
          schema:
            type: string
            example: "ACC0011"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopUpRequest'
      responses:
        '200':
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopUpStartResponse'
        '403':
          description: Not your account (AUTH-403) or the account is not active (ACC-403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Account not found (ACC-404)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Amount missing, outside $10.00 to $10,000.00, or with more than 2 decimals (VAL-422)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorCode: "VAL-422"
                message: "The minimum top-up is $10.00"
        '502':
          description: Stripe could not start the payment (PAY-502)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Payments are not configured on this server (PAY-503)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorCode: "PAY-503"
                message: "Adding funds isn't available right now"

  /accounts/{accountId}/top-ups/{sessionId}/confirm:
    post:
      tags:
        - Top-ups
      summary: Confirm a Stripe top-up and credit the account
      description: >
        Asks Stripe whether the checkout session is paid, for this account, in USD,
        then credits the amount Stripe charged. The credit is keyed by Stripe's payment ID,
        so confirming the same session again returns 200 and changes nothing.
      operationId: confirmTopUp
      parameters:
        - name: accountId
          in: path
          required: true
          description: Your own account ID
          schema:
            type: string
            example: "ACC0011"
        - name: sessionId
          in: path
          required: true
          description: The Stripe Checkout session ID from the return URL
          schema:
            type: string
            example: "cs_test_a1B2c3"
      responses:
        '200':
          description: Credited (or already credited earlier)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopUpConfirmResponse'
        '403':
          description: Not your account, or the payment was made for a different account (AUTH-403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Unknown or malformed session ID (PAY-404)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The payment is not completed, or cannot be added (PAY-409)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorCode: "PAY-409"
                message: "This payment hasn't been completed"
        '502':
          description: Stripe could not be reached (PAY-502)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Payments are not configured on this server (PAY-503)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    Account:
      type: object
      description: Account object with all properties
      properties:
        accountId:
          type: string
          description: Unique account identifier
          example: "ACC001"
        holderName:
          type: string
          description: Name of the account holder
          example: "John Doe"
        cashBalance:
          type: number
          format: decimal
          description: Current cash balance in the account
          example: 5000.00
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, CLOSED]
          description: Current status of the account
          example: "ACTIVE"
        version:
          type: integer
          description: Optimistic locking version
          example: 1
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp of account creation
          example: "2026-09-22T10:30:00Z"
        lastUpdated:
          type: string
          format: date-time
          description: ISO 8601 timestamp of last update
          example: "2026-09-22T10:30:00Z"
        updatedBy:
          type: string
          nullable: true
          description: User who last updated the account
          example: "admin"
      required:
        - accountId
        - holderName
        - cashBalance
        - status
        - version

    CreateAccountRequest:
      type: object
      description: Request body for creating a new account
      properties:
        accountId:
          type: string
          description: Unique account identifier
          example: "ACC001"
        holderName:
          type: string
          description: Name of the account holder
          example: "John Doe"
        cashBalance:
          type: number
          format: decimal
          description: Initial cash balance
          example: 5000.00
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, CLOSED]
          description: Initial account status
          example: "ACTIVE"
      required:
        - accountId
        - holderName
        - cashBalance
        - status

    UpdateAccountRequest:
      type: object
      description: Request body for updating an account
      properties:
        holderName:
          type: string
          nullable: true
          description: Updated holder name (optional)
          example: "Jane Smith"
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, CLOSED]
          nullable: true
          description: Updated account status (optional)
          example: "SUSPENDED"

    CreditDebitRequest:
      type: object
      description: Request body for credit/debit operations
      properties:
        amount:
          type: number
          format: decimal
          description: Amount to credit or debit
          example: 1000.00
          minimum: 0.01
        orderId:
          type: string
          description: >
            Optional. The order this movement belongs to. When sent, the movement is applied
            at most once per order; a repeat returns the current balance and changes nothing.
          example: "0adf7599-df9d-4176-93b6-3a555e54415d"
      required:
        - amount

    ReversalRequest:
      type: object
      description: Request body for reversing an order's cash movement
      properties:
        orderId:
          type: string
          description: The order whose debit or credit should be reversed
          example: "0adf7599-df9d-4176-93b6-3a555e54415d"
      required:
        - orderId

    TopUpRequest:
      type: object
      properties:
        amount:
          type: number
          format: double
          minimum: 10.00
          maximum: 10000.00
          description: Dollars to add, with at most 2 decimals
          example: 250.00
        returnTo:
          type: string
          maxLength: 200
          description: App path to return to after paying
          example: "/positions"
      required:
        - amount

    TopUpStartResponse:
      type: object
      properties:
        checkoutUrl:
          type: string
          description: Stripe's hosted payment page
          example: "https://checkout.stripe.com/c/pay/cs_test_a1B2c3"
      required:
        - checkoutUrl

    TopUpConfirmResponse:
      type: object
      properties:
        amount:
          type: number
          format: double
          description: Dollars added by this payment
          example: 250.00
        cashBalance:
          type: number
          format: double
          description: The account's cash balance after the top-up
          example: 750.00
      required:
        - amount
        - cashBalance

    ErrorResponse:
      type: object
      description: Error response object
      properties:
        errorCode:
          type: string
          description: Unique error code identifier
          example: "ACC-404"
        message:
          type: string
          description: Detailed error message
          example: "Account not found: ACC001"
      required:
        - errorCode
        - message


