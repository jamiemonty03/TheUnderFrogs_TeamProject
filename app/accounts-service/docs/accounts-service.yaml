openapi: 3.0.0
info:
  title: Accounts Service API
  description: Microservice for account management and financial operations
  version: 1.0.0
  contact:
    name: Neueda LEAP Team
    url: https://github.com/neueda/leap
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: https://accounts-service.example.com
    description: Production Server
  - url: http://localhost:8081
    description: Local Development Server

tags:
  - name: Accounts
    description: Account management operations
  - name: Credit Operations
    description: Account credit operations
  - name: Debit Operations
    description: Account debit operations

paths:
  /accounts:
    post:
      tags:
        - Accounts
      summary: Create a new account
      description: Creates a new account with the provided details
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
            examples:
              success:
                summary: Valid account creation
                value:
                  accountId: "ACC001"
                  holderName: "John Doe"
                  cashBalance: 5000.00
                  status: "ACTIVE"
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              examples:
                success:
                  summary: Successfully created account
                  value:
                    accountId: "ACC001"
                    holderName: "John Doe"
                    cashBalance: 5000
                    status: "ACTIVE"
                    version: 1
                    createdAt: "2026-09-22T10:30:00Z"
                    lastUpdated: "2026-09-22T10:30:00Z"
        '422':
          description: Unprocessable Entity - Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingField:
                  summary: Missing required field
                  value:
                    errorCode: "VAL-422"
                    message: "Account ID cannot be null or blank"
                invalidData:
                  summary: Invalid data format
                  value:
                    errorCode: "VAL-422"
                    message: "Holder name cannot be null or blank"

  /accounts/{accountId}:
    get:
      tags:
        - Accounts
      summary: Retrieve an account by ID
      description: Fetches account details using the account ID
      operationId: getAccount
      parameters:
        - name: accountId
          in: path
          required: true
          description: The unique identifier of the account
          schema:
            type: string
            example: "ACC001"
      responses:
        '200':
          description: Account retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              examples:
                success:
                  summary: Account found
                  value:
                    accountId: "ACC001"
                    holderName: "John Doe"
                    cashBalance: 5000
                    status: "ACTIVE"
                    version: 1
                    createdAt: "2026-09-22T10:30:00Z"
                    lastUpdated: "2026-09-22T10:30:00Z"
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  summary: Account does not exist
                  value:
                    errorCode: "ACC-404"
                    message: "Account not found: ACC001"

    put:
      tags:
        - Accounts
      summary: Update an account
      description: Updates account details (holder name and/or status)
      operationId: updateAccount
      parameters:
        - name: accountId
          in: path
          required: true
          description: The unique identifier of the account
          schema:
            type: string
            example: "ACC001"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
            examples:
              updateName:
                summary: Update holder name
                value:
                  holderName: "Jane Smith"
              updateStatus:
                summary: Update account status
                value:
                  status: "SUSPENDED"
      responses:
        '200':
          description: Account updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              examples:
                success:
                  summary: Successfully updated account
                  value:
                    accountId: "ACC001"
                    holderName: "Jane Smith"
                    cashBalance: 5000
                    status: "ACTIVE"
                    version: 2
                    createdAt: "2026-09-22T10:30:00Z"
                    lastUpdated: "2026-09-22T10:45:00Z"
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  summary: Account does not exist
                  value:
                    errorCode: "ACC-404"
                    message: "Account not found: ACC001"
        '422':
          description: Unprocessable Entity - Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidData:
                  summary: Invalid holder name
                  value:
                    errorCode: "VAL-422"
                    message: "Holder name cannot be null or blank"

    delete:
      tags:
        - Accounts
      summary: Delete an account
      description: Deletes an account and all associated data
      operationId: deleteAccount
      parameters:
        - name: accountId
          in: path
          required: true
          description: The unique identifier of the account
          schema:
            type: string
            example: "ACC001"
      responses:
        '204':
          description: Account deleted successfully
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  summary: Account does not exist
                  value:
                    errorCode: "ACC-404"
                    message: "Account not found: ACC001"

  /accounts/{accountId}/credit:
    post:
      tags:
        - Credit Operations
      summary: Credit an account
      description: Adds funds to an active account's cash balance
      operationId: creditAccount
      parameters:
        - name: accountId
          in: path
          required: true
          description: The unique identifier of the account
          schema:
            type: string
            example: "ACC001"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditDebitRequest'
            examples:
              creditFunds:
                summary: Credit 1000 to account
                value:
                  amount: 1000.00
      responses:
        '200':
          description: Account credited successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              examples:
                success:
                  summary: Successfully credited account
                  value:
                    accountId: "ACC001"
                    holderName: "John Doe"
                    cashBalance: 6000
                    status: "ACTIVE"
                    version: 2
                    createdAt: "2026-09-22T10:30:00Z"
                    lastUpdated: "2026-09-22T10:50:00Z"
        '400':
          description: Bad Request - Insufficient funds or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                insufficientFunds:
                  summary: Insufficient funds in account
                  value:
                    errorCode: "ORD-400"
                    message: "Insufficient funds. Balance: 5000, Requested: 6000"
        '403':
          description: Forbidden - Account is not active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                accountInactive:
                  summary: Cannot credit inactive account
                  value:
                    errorCode: "ACC-403"
                    message: "Cannot credit an inactive account"
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  summary: Account does not exist
                  value:
                    errorCode: "ACC-404"
                    message: "Account not found: ACC001"
        '422':
          description: Unprocessable Entity - Invalid amount
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                negativeAmount:
                  summary: Amount cannot be negative or zero
                  value:
                    errorCode: "VAL-422"
                    message: "Credit amount must be positive"
                zeroAmount:
                  summary: Amount must be greater than zero
                  value:
                    errorCode: "VAL-422"
                    message: "Credit amount must be positive"

  /accounts/{accountId}/debit:
    post:
      tags:
        - Debit Operations
      summary: Debit an account
      description: Withdraws funds from an active account's cash balance
      operationId: debitAccount
      parameters:
        - name: accountId
          in: path
          required: true
          description: The unique identifier of the account
          schema:
            type: string
            example: "ACC001"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditDebitRequest'
            examples:
              debitFunds:
                summary: Debit 1000 from account
                value:
                  amount: 1000.00
      responses:
        '200':
          description: Account debited successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              examples:
                success:
                  summary: Successfully debited account
                  value:
                    accountId: "ACC001"
                    holderName: "John Doe"
                    cashBalance: 4000
                    status: "ACTIVE"
                    version: 2
                    createdAt: "2026-09-22T10:30:00Z"
                    lastUpdated: "2026-09-22T10:55:00Z"
        '400':
          description: Bad Request - Insufficient funds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                insufficientFunds:
                  summary: Insufficient funds in account
                  value:
                    errorCode: "ORD-400"
                    message: "Insufficient funds. Balance: 3000, Requested: 5000"
        '403':
          description: Forbidden - Account is not active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                accountInactive:
                  summary: Cannot debit inactive account
                  value:
                    errorCode: "ACC-403"
                    message: "Cannot debit an inactive account"
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  summary: Account does not exist
                  value:
                    errorCode: "ACC-404"
                    message: "Account not found: ACC001"
        '422':
          description: Unprocessable Entity - Invalid amount
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                negativeAmount:
                  summary: Amount cannot be negative or zero
                  value:
                    errorCode: "VAL-422"
                    message: "Debit amount must be positive"
                zeroAmount:
                  summary: Amount must be greater than zero
                  value:
                    errorCode: "VAL-422"
                    message: "Debit amount must be positive"

components:
  schemas:
    Account:
      type: object
      description: Account object with all properties
      properties:
        accountId:
          type: string
          description: Unique account identifier
          example: "ACC001"
        holderName:
          type: string
          description: Name of the account holder
          example: "John Doe"
        cashBalance:
          type: number
          format: decimal
          description: Current cash balance in the account
          example: 5000.00
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, CLOSED]
          description: Current status of the account
          example: "ACTIVE"
        version:
          type: integer
          description: Optimistic locking version
          example: 1
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp of account creation
          example: "2026-09-22T10:30:00Z"
        lastUpdated:
          type: string
          format: date-time
          description: ISO 8601 timestamp of last update
          example: "2026-09-22T10:30:00Z"
        updatedBy:
          type: string
          nullable: true
          description: User who last updated the account
          example: "admin"
      required:
        - accountId
        - holderName
        - cashBalance
        - status
        - version

    CreateAccountRequest:
      type: object
      description: Request body for creating a new account
      properties:
        accountId:
          type: string
          description: Unique account identifier
          example: "ACC001"
        holderName:
          type: string
          description: Name of the account holder
          example: "John Doe"
        cashBalance:
          type: number
          format: decimal
          description: Initial cash balance
          example: 5000.00
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, CLOSED]
          description: Initial account status
          example: "ACTIVE"
      required:
        - accountId
        - holderName
        - cashBalance
        - status

    UpdateAccountRequest:
      type: object
      description: Request body for updating an account
      properties:
        holderName:
          type: string
          nullable: true
          description: Updated holder name (optional)
          example: "Jane Smith"
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, CLOSED]
          nullable: true
          description: Updated account status (optional)
          example: "SUSPENDED"

    CreditDebitRequest:
      type: object
      description: Request body for credit/debit operations
      properties:
        amount:
          type: number
          format: decimal
          description: Amount to credit or debit
          example: 1000.00
          minimum: 0.01
      required:
        - amount

    ErrorResponse:
      type: object
      description: Error response object
      properties:
        errorCode:
          type: string
          description: Unique error code identifier
          example: "ACC-404"
        message:
          type: string
          description: Detailed error message
          example: "Account not found: ACC001"
      required:
        - errorCode
        - message


