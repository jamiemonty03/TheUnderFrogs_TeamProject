spring:
  application:
    name: instruments-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.r2dbc.R2dbcAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: instruments-live-prices
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://auth-service:8081/.well-known/jwks.json}
          issuer-uri: ${AUTH_ISSUER:auth-service}
          audiences: ${AUTH_AUDIENCE:trading-platform}
server:
  address: 0.0.0.0
  port: 8081
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        "http.server.requests": true
mybatis:
  mapper-locations: classpath:mappers/*.xml
  type-aliases-package: com.neueda.instrumentservice.models
alpaca:
  key-id: ${ALPACA_KEY_ID:}
  secret-key: ${ALPACA_SECRET_KEY:}
  news-url: ${ALPACA_NEWS_URL:https://data.alpaca.markets/v1beta1/news}
