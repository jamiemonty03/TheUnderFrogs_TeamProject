openapi: 3.0.0
info:
  title: Instruments API
  description: Base instrument reference data (symbol, name, asset class, currency, exchange)
  version: 1.0.0
  contact:
    name: Neueda LEAP Team
    url: https://github.com/neueda/leap
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: https://instruments-service.example.com
    description: Production Server
  - url: http://localhost:8082/api
    description: Local Development Server

tags:
  - name: Instruments
    description: Base instrument reference data operations
  - name: News
    description: Recent market news from Alpaca

paths:
  /news:
    get:
      tags:
        - News
      summary: List recent market news
      description: Returns recent news mapped from Alpaca without exposing provider credentials or response details
      operationId: getNews
      parameters:
        - name: limit
          in: query
          required: false
          description: Number of headlines to return; must be between 1 and 25
          schema:
            type: integer
            minimum: 1
            maximum: 25
            default: 5
            example: 5
      responses:
        '200':
          description: Recent news retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NewsResponse'
        '422':
          description: Invalid limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: News provider rate limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: News provider unavailable or not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /instruments:
    get:
      tags:
        - Instruments
      summary: List all instruments
      description: Returns every instrument in the repository
      operationId: getInstruments
      responses:
        '200':
          description: Instruments retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InstrumentResponse'
              examples:
                success:
                  summary: A mix of stocks, ETFs and bonds
                  value:
                    - symbol: "AAPL"
                      name: "Apple Inc."
                      assetClass: "Equity"
                      currency: "USD"
                      exchange: "NasdaqGS"
                      tradable: true
                    - symbol: "SPY"
                      name: "State Street SPDR S&P 500 ETF T"
                      assetClass: "ETF"
                      currency: "USD"
                      exchange: "NYSEArca"
                      tradable: true

  /instruments/live-prices:
    get:
      tags:
        - Instruments
      summary: Latest live quotes, for some symbols or all of them
      description: >-
        Returns the latest live quote held for each requested symbol, read from the market-data Kafka topic
        (PRICE_UPDATED events from trade-executor). Symbols with no live quote yet, for example outside market
        hours, are left out, so callers should fall back to the daily close.
      operationId: getLivePrices
      parameters:
        - name: symbols
          in: query
          required: false
          description: Comma-separated ticker symbols. Leave out to get every tracked symbol's quote.
          schema:
            type: string
            example: "AAPL,SPY"
      responses:
        '200':
          description: Live quotes for the symbols that have one
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LivePriceResponse'
              examples:
                success:
                  summary: One symbol quoted, one without a quote
                  value:
                    - symbol: "AAPL"
                      price: 189.85
                      bid: 189.80
                      ask: 189.90
                      quoteTime: "2026-10-13T14:30:00Z"

  /instruments/{symbol}:
    get:
      tags:
        - Instruments
      summary: Retrieve an instrument by symbol
      description: Fetches a single instrument's reference data by its ticker symbol
      operationId: getInstrument
      parameters:
        - name: symbol
          in: path
          required: true
          description: The instrument's ticker symbol
          schema:
            type: string
            example: "AAPL"
      responses:
        '200':
          description: Instrument retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentResponse'
              examples:
                success:
                  summary: Instrument found
                  value:
                    symbol: "AAPL"
                    name: "Apple Inc."
                    assetClass: "Equity"
                    currency: "USD"
                    exchange: "NasdaqGS"
                    tradable: true
        '404':
          description: Instrument not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  summary: Instrument does not exist
                  value:
                    errorCode: "INS-404"
                    message: "Instrument not found"

    delete:
      tags:
        - Instruments
      summary: Delete an instrument
      description: >
        Deletes an instrument by symbol. Note: instruments-service's ETL
        (db/etl/01-generate_raw_instruments.py) is the authoritative writer
        for the base instrument set and upserts on every run - deleting a
        symbol that's part of the ETL's fixed ticker list will not persist
        past the next ETL run.
      operationId: deleteInstrument
      parameters:
        - name: symbol
          in: path
          required: true
          description: The instrument's ticker symbol
          schema:
            type: string
            example: "AAPL"
      responses:
        '204':
          description: Instrument deleted successfully
        '404':
          description: Instrument not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  summary: Instrument does not exist
                  value:
                    errorCode: "INS-404"
                    message: "Instrument not found"

components:
  schemas:
    NewsResponse:
      type: object
      description: Public news fields returned by the instruments service
      properties:
        headline:
          type: string
          example: "Markets rally after earnings"
        articleUrl:
          type: string
          format: uri
          example: "https://example.com/article"
        publishedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
        symbols:
          type: array
          items:
            type: string
          example: ["AAPL", "MSFT"]
      required:
        - headline
        - articleUrl
        - publishedAt
        - symbols

    InstrumentResponse:
      type: object
      description: Base instrument reference data
      properties:
        symbol:
          type: string
          description: Unique ticker symbol
          example: "AAPL"
        name:
          type: string
          description: Instrument display name
          example: "Apple Inc."
        assetClass:
          type: string
          enum: [Equity, Bond, ETF]
          description: Classification of the instrument
          example: "Equity"
        currency:
          type: string
          description: ISO currency code the instrument trades in
          example: "USD"
        exchange:
          type: string
          description: Exchange the instrument trades on
          example: "NasdaqGS"
        tradable:
          type: boolean
          description: Whether the instrument is currently tradable
          example: true
      required:
        - symbol
        - name
        - assetClass
        - currency
        - exchange
        - tradable

    LivePriceResponse:
      type: object
      properties:
        symbol:
          type: string
          example: "AAPL"
        price:
          type: number
          description: Mid of bid and ask
          example: 189.85
        bid:
          type: number
          example: 189.80
        ask:
          type: number
          example: 189.90
        quoteTime:
          type: string
          format: date-time
          example: "2026-10-13T14:30:00Z"

    ErrorResponse:
      type: object
      description: Error response object
      properties:
        errorCode:
          type: string
          description: Unique error code identifier
          example: "INS-404"
        message:
          type: string
          description: Detailed error message
          example: "Instrument not found"
      required:
        - errorCode
        - message
