openapi: 3.0.3
info:
  title: Order Service
  description: >
    Manages order lifecycle including creation, retrieval, updates, and cancellation.
    Provides REST endpoints for order CRUD operations and account-based order queries.
  version: 1.0.0
  license:
    name: Internal use only

servers:
  - url: /v1

paths:
  /orders/{orderId}:
    get:
      summary: Retrieve an order by ID
      operationId: getOrderById
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            description: The unique order identifier
      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Update mutable order fields
      description: >
        Updates quantity, priceLimit, side and updatedBy. The order status cannot be changed here:
        sending orderStatus returns 422. Use PATCH /orders/{orderId}/status instead.
      operationId: updateOrder
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            description: The unique order identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderRequest'
      responses:
        '200':
          description: Order updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed, including an attempt to change orderStatus (errorCode VAL-422)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorCode: VAL-422
                message: "orderStatus cannot be changed with PUT; use PATCH /orders/{id}/status"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Cancel an order (soft delete)
      operationId: deleteOrder
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            description: The unique order identifier
      responses:
        '204':
          description: Order was NEW and is now CANCELLED; ORDER_CANCELLED published after commit
        '404':
          description: Order not found (errorCode ORD-404)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorCode: ORD-404
                message: "Order not found: 0adf7599-df9d-4176-93b6-3a555e54415d"
        '409':
          description: Order is no longer NEW (already FILLED, REJECTED or CANCELLED); nothing is changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorCode: ORD-409
                message: "Order 0adf7599-df9d-4176-93b6-3a555e54415d cannot be cancelled: status is FILLED"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/{orderId}/status:
    patch:
      summary: Change an order's status, only if it is still in the expected status
      description: >
        Applies a single guarded update (UPDATE ... WHERE order_id = ? AND order_status = expectedStatus),
        so when two callers race exactly one succeeds. The only allowed changes are NEW to FILLED,
        NEW to REJECTED and NEW to CANCELLED. A repeated change returns 409 with the current status,
        so a caller that receives 409 with currentStatus equal to newStatus can treat the change as already done.
        This is the only way to change an order's status.
      operationId: updateOrderStatus
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            description: The unique order identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatusRequest'
            example:
              expectedStatus: NEW
              newStatus: FILLED
              reason: "Filled by trade executor"
      responses:
        '200':
          description: Status changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          description: Order not found (errorCode ORD-404)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The order is no longer in expectedStatus; nothing is changed (errorCode ORD-409)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusConflictResponse'
              example:
                errorCode: ORD-409
                message: "Order 0adf7599-df9d-4176-93b6-3a555e54415d is FILLED, expected NEW"
                currentStatus: FILLED
        '422':
          description: The change is not allowed, or the request is invalid (errorCode VAL-422)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorCode: VAL-422
                message: "Status change FILLED -> NEW is not allowed"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders:
    post:
      summary: Place a new order
      operationId: placeOrder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
      responses:
        '201':
          description: Order accepted with status NEW; execution proceeds asynchronously
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Invalid order parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Account or instrument not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/account/{accountId}:
    get:
      summary: Retrieve all orders for an account
      operationId: getOrdersByAccount
      security:
        - bearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            description: The account identifier
      responses:
        '200':
          description: List of orders for the account
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    OrderResponse:
      type: object
      required: [orderId, accountId, symbol, side, quantity, priceLimit, orderStatus, version, createdAt, lastUpdated]
      properties:
        orderId:
          type: string
          description: Unique order identifier
        accountId:
          type: string
          description: Account that placed the order
        symbol:
          type: string
          description: Security symbol (e.g., AAPL)
        side:
          type: string
          enum: [BUY, SELL]
          description: Order direction
        quantity:
          type: integer
          description: Number of shares
          minimum: 1
        priceLimit:
          type: number
          format: decimal
          description: Worst price per share the user accepts. The order fills at the market price, not this value.
        orderStatus:
          type: string
          enum: [NEW, FILLED, CANCELLED, REJECTED]
          description: Current order status; newly placed orders are NEW while awaiting execution
        version:
          type: integer
          description: Version number for optimistic locking
          minimum: 0
        createdAt:
          type: string
          format: date-time
          description: Order creation timestamp
        lastUpdated:
          type: string
          format: date-time
          nullable: true
          description: Last modification timestamp
        updatedBy:
          type: string
          nullable: true
          description: User who last updated the order

    PlaceOrderRequest:
      type: object
      required: [accountId, symbol, side, quantity, priceLimit, idempotencyKey]
      properties:
        accountId:
          type: string
          description: Account placing the order
        symbol:
          type: string
          description: Security symbol
        side:
          type: string
          enum: [BUY, SELL]
          description: Order direction
        quantity:
          type: number
          description: Number of shares (integers only)
        priceLimit:
          type: number
          format: decimal
          description: >
            Worst price per share you accept: the most you pay on a BUY, the least you receive on a SELL.
            The order fills at the market price, or is rejected if the market is past this limit.
          example: 190.00
        idempotencyKey:
          type: string
          description: Unique key for idempotent order placement

    UpdateOrderRequest:
      type: object
      description: >
        Update mutable order fields (all optional - only provided fields are updated).
        orderStatus must be left out; status only changes through PATCH /orders/{orderId}/status.
      properties:
        quantity:
          type: integer
          minimum: 1
          description: New quantity
        priceLimit:
          type: number
          format: decimal
          description: New price limit
        side:
          type: string
          enum: [BUY, SELL]
          description: New order side
        orderStatus:
          type: string
          enum: [NEW, FILLED, CANCELLED, REJECTED]
          nullable: true
          description: Not allowed - sending any value returns 422. Use PATCH /orders/{orderId}/status.
        updatedBy:
          type: string
          description: User making the update

    ErrorResponse:
      type: object
      required: [message]
      properties:
        errorCode:
          type: string
          nullable: true
          description: Application-specific error code
        message:
          type: string
          description: Human-readable error message

    UpdateOrderStatusRequest:
      type: object
      required: [expectedStatus, newStatus]
      properties:
        expectedStatus:
          type: string
          enum: [NEW, FILLED, CANCELLED, REJECTED]
          description: The status the order must currently have; only NEW is allowed
        newStatus:
          type: string
          enum: [NEW, FILLED, CANCELLED, REJECTED]
          description: The status to change to; must be FILLED, REJECTED or CANCELLED
        reason:
          type: string
          nullable: true
          description: Why the status is changing; logged for audit

    StatusConflictResponse:
      type: object
      required: [errorCode, message, currentStatus]
      properties:
        errorCode:
          type: string
          description: Always ORD-409
        message:
          type: string
          description: Human-readable error message
        currentStatus:
          type: string
          enum: [NEW, FILLED, CANCELLED, REJECTED]
          description: The order's status at the time of the request

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
