openapi: 3.0.3
info:
  title: Order Service
  description: >
    Manages order lifecycle including creation, retrieval, updates, and cancellation.
    Provides REST endpoints for order CRUD operations and account-based order queries.
  version: 1.0.0
  license:
    name: Internal use only

servers:
  - url: /api
    description: Every service is served under the /api context path. The Angular dev proxy and nginx route /api/<resource> to the right service.

paths:
  /orders/{orderId}:
    get:
      tags:
        - Orders
      summary: Retrieve an order by ID
      operationId: getOrderById
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            description: The unique order identifier
      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          description: Order not found. Returned with an empty body.
        '401':
          description: Missing, invalid or expired access token. Returned by Spring Security with an empty body.
    put:
      tags:
        - Orders
      summary: Update mutable order fields
      description: >
        Updates quantity, priceLimit, side and updatedBy. The order status cannot be changed here:
        sending orderStatus returns 422. Use PATCH /orders/{orderId}/status instead.
      operationId: updateOrder
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            description: The unique order identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderRequest'
      responses:
        '200':
          description: Order updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          description: Order not found. Returned with an empty body.
        '422':
          description: Validation failed, including an attempt to change orderStatus (errorCode VAL-422)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorCode: VAL-422
                message: "orderStatus cannot be changed with PUT; use PATCH /orders/{id}/status"
        '401':
          description: Missing, invalid or expired access token. Returned by Spring Security with an empty body.
    delete:
      tags:
        - Orders
      summary: Cancel an order (soft delete)
      operationId: deleteOrder
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            description: The unique order identifier
      responses:
        '204':
          description: Order was NEW and is now CANCELLED; ORDER_CANCELLED published after commit
        '404':
          description: Order not found (errorCode ORD-404)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorCode: ORD-404
                message: "Order not found: 0adf7599-df9d-4176-93b6-3a555e54415d"
        '409':
          description: Order is no longer NEW (already FILLED, REJECTED or CANCELLED); nothing is changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorCode: ORD-409
                message: "Order 0adf7599-df9d-4176-93b6-3a555e54415d cannot be cancelled: status is FILLED"
        '401':
          description: Missing, invalid or expired access token. Returned by Spring Security with an empty body.
  /orders/{orderId}/status:
    patch:
      tags:
        - Orders
      summary: Change an order's status, only if it is still in the expected status
      description: >
        Applies a single guarded update (UPDATE ... WHERE order_id = ? AND order_status = expectedStatus),
        so when two callers race exactly one succeeds. The only allowed changes are NEW to FILLED,
        NEW to REJECTED and NEW to CANCELLED. A repeated change returns 409 with the current status,
        so a caller that receives 409 with currentStatus equal to newStatus can treat the change as already done.
        This is the only way to change an order's status. A change to FILLED must include fillPrice, and records
        the fill in client trade history (GET /client-trades) in the same transaction, so each filled order
        has exactly one client trade.
      operationId: updateOrderStatus
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            description: The unique order identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatusRequest'
            example:
              expectedStatus: NEW
              newStatus: FILLED
              fillPrice: 148.50
              reason: "Filled by trade executor"
      responses:
        '200':
          description: Status changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          description: Order not found (errorCode ORD-404)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The order is no longer in expectedStatus; nothing is changed (errorCode ORD-409)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusConflictResponse'
              example:
                errorCode: ORD-409
                message: "Order 0adf7599-df9d-4176-93b6-3a555e54415d is FILLED, expected NEW"
                currentStatus: FILLED
        '422':
          description: The change is not allowed, or the request is invalid, including FILLED without fillPrice or fillPrice with another newStatus (errorCode VAL-422)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorCode: VAL-422
                message: "Status change FILLED -> NEW is not allowed"
        '401':
          description: Missing, invalid or expired access token. Returned by Spring Security with an empty body.
  /orders:
    get:
      tags:
        - Orders
      summary: List all orders
      description: Returns every user's records, not only the caller's. Intended for admin use only and due to be restricted to the ADMIN role; do not call it from trader screens.
      operationId: listOrders
      responses:
        '200':
          description: All orders, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'
        '401':
          description: Missing, invalid or expired access token. Returned by Spring Security with an empty body.
    post:
      tags:
        - Orders
      summary: Place a new order
      operationId: placeOrder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
      responses:
        '201':
          description: Order accepted with status NEW; execution proceeds asynchronously
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Invalid order parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Account or instrument not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid or expired access token. Returned by Spring Security with an empty body.
  /orders/account/{accountId}:
    get:
      tags:
        - Orders
      summary: Retrieve all orders for an account
      operationId: getOrdersByAccount
      security:
        - bearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            description: The account identifier
      responses:
        '200':
          description: List of orders for the account
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'
        '401':
          description: Missing, invalid or expired access token. Returned by Spring Security with an empty body.
  /client-trades:
    get:
      tags:
        - ClientTrades
      summary: Search historical client trades
      description: >
        Returns historical trades matching every filter given, newest first (by trade date, then trade ID).
        All filters are optional; with none, every trade is returned. Read-only: trades are recorded when
        orders execute, not through this API.
      operationId: searchClientTrades
      security:
        - bearerAuth: []
      parameters:
        - name: accountId
          in: query
          required: false
          schema:
            type: string
          description: Only trades for this client account (e.g. ACC0001)
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Earliest trade date, inclusive (YYYY-MM-DD)
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Latest trade date, inclusive (YYYY-MM-DD); must not be before from
        - name: assetClass
          in: query
          required: false
          schema:
            type: string
            enum: [Equity, Bond, ETF]
          description: >
            Only trades in instruments of this type (case-insensitive). Resolved against instruments-service,
            so the request returns 503 if instruments-service is unavailable.
        - name: symbol
          in: query
          required: false
          schema:
            type: string
          description: Only trades in this symbol
        - name: side
          in: query
          required: false
          schema:
            type: string
            enum: [BUY, SELL]
          description: Only trades on this side
      responses:
        '200':
          description: Matching trades (may be empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientTradeResponse'
        '401':
          description: Missing, invalid or expired access token. Returned by Spring Security with an empty body.
        '422':
          description: Invalid filter (bad date format, from after to, unknown assetClass or side)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: assetClass was given and instruments-service could not be reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /client-trades/{tradeId}:
    get:
      tags:
        - ClientTrades
      summary: Retrieve a historical client trade by ID
      operationId: getClientTradeById
      security:
        - bearerAuth: []
      parameters:
        - name: tradeId
          in: path
          required: true
          schema:
            type: integer
          description: The trade identifier
      responses:
        '200':
          description: Trade found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientTradeResponse'
        '404':
          description: Trade not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid or expired access token. Returned by Spring Security with an empty body.
  /client-trades/account/{accountId}:
    get:
      tags:
        - ClientTrades
      summary: Retrieve all historical trades for an account
      operationId: getClientTradesByAccount
      security:
        - bearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
          description: The account identifier
      responses:
        '200':
          description: The account's trades, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientTradeResponse'
        '401':
          description: Missing, invalid or expired access token. Returned by Spring Security with an empty body.
components:
  schemas:
    OrderResponse:
      type: object
      required: [orderId, accountId, symbol, side, quantity, priceLimit, orderStatus, version, createdAt, lastUpdated]
      properties:
        orderId:
          type: string
          description: Unique order identifier
        accountId:
          type: string
          description: Account that placed the order
        symbol:
          type: string
          description: Security symbol (e.g., AAPL)
        side:
          type: string
          enum: [BUY, SELL]
          description: Order direction
        quantity:
          type: integer
          description: Number of shares
          minimum: 1
        priceLimit:
          type: number
          format: decimal
          description: Worst price per share the user accepts. The order fills at the market price, not this value.
        orderStatus:
          type: string
          enum: [NEW, FILLED, CANCELLED, REJECTED]
          description: Current order status; newly placed orders are NEW while awaiting execution
        version:
          type: integer
          description: Version number for optimistic locking
          minimum: 0
        createdAt:
          type: string
          format: date-time
          description: Order creation timestamp. Local date-time without a timezone offset, e.g. 2026-10-12T15:23:58.713
        lastUpdated:
          type: string
          format: date-time
          nullable: true
          description: Last modification timestamp. Local date-time without a timezone offset, e.g. 2026-10-12T15:23:58.713
        updatedBy:
          type: string
          nullable: true
          description: User who last updated the order

    PlaceOrderRequest:
      type: object
      required: [accountId, symbol, side, quantity, priceLimit, idempotencyKey]
      properties:
        accountId:
          type: string
          description: Account placing the order
        symbol:
          type: string
          description: Security symbol
        side:
          type: string
          enum: [BUY, SELL]
          description: Order direction
        quantity:
          type: number
          description: Number of shares (integers only)
        priceLimit:
          type: number
          format: decimal
          description: >
            Worst price per share you accept: the most you pay on a BUY, the least you receive on a SELL.
            The order fills at the market price, or is rejected if the market is past this limit.
          example: 190.00
        idempotencyKey:
          type: string
          description: Unique key for idempotent order placement

    UpdateOrderRequest:
      type: object
      description: >
        Update mutable order fields (all optional - only provided fields are updated).
        orderStatus must be left out; status only changes through PATCH /orders/{orderId}/status.
      properties:
        quantity:
          type: integer
          minimum: 1
          description: New quantity
        priceLimit:
          type: number
          format: decimal
          description: New price limit
        side:
          type: string
          enum: [BUY, SELL]
          description: New order side
        orderStatus:
          type: string
          enum: [NEW, FILLED, CANCELLED, REJECTED]
          nullable: true
          description: Not allowed - sending any value returns 422. Use PATCH /orders/{orderId}/status.
        updatedBy:
          type: string
          description: User making the update

    ClientTradeResponse:
      type: object
      required: [tradeId, accountId, symbol, tradeType, quantity, price, tradeDate, version, createdAt, lastUpdated, updatedBy]
      properties:
        tradeId:
          type: integer
          description: Unique trade identifier
        accountId:
          type: string
          description: Client account that made the trade
        symbol:
          type: string
          description: Security symbol (e.g., AAPL)
        tradeType:
          type: string
          enum: [BUY, SELL]
          description: Trade direction
        quantity:
          type: number
          format: decimal
          description: Number of units traded (up to 4 decimal places)
        price:
          type: number
          format: decimal
          description: Price per unit
        tradeDate:
          type: string
          format: date
          description: Date the trade executed
        version:
          type: integer
          minimum: 0
          description: Version number for optimistic locking
        createdAt:
          type: string
          format: date-time
          description: When the record was created
        lastUpdated:
          type: string
          format: date-time
          description: When the record was last modified
        updatedBy:
          type: string
          description: User or process that last modified the record

    ErrorResponse:
      type: object
      required: [message]
      properties:
        errorCode:
          type: string
          nullable: true
          description: Application-specific error code
        message:
          type: string
          description: Human-readable error message

    UpdateOrderStatusRequest:
      type: object
      required: [expectedStatus, newStatus]
      properties:
        expectedStatus:
          type: string
          enum: [NEW, FILLED, CANCELLED, REJECTED]
          description: The status the order must currently have; only NEW is allowed
        newStatus:
          type: string
          enum: [NEW, FILLED, CANCELLED, REJECTED]
          description: The status to change to; must be FILLED, REJECTED or CANCELLED
        fillPrice:
          type: number
          format: decimal
          minimum: 0.01
          nullable: true
          description: The execution price; required when newStatus is FILLED and not allowed otherwise
        reason:
          type: string
          nullable: true
          description: Why the status is changing; logged for audit

    StatusConflictResponse:
      type: object
      required: [errorCode, message, currentStatus]
      properties:
        errorCode:
          type: string
          description: Always ORD-409
        message:
          type: string
          description: Human-readable error message
        currentStatus:
          type: string
          enum: [NEW, FILLED, CANCELLED, REJECTED]
          description: The order's status at the time of the request

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
