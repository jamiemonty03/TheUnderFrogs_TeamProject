spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  application:
    name: orders-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.r2dbc.R2dbcAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none   # tables are created by db/schema/*.sql
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://auth-service:8081/.well-known/jwks.json}
          issuer-uri: ${AUTH_ISSUER:auth-service}
          audiences: ${AUTH_AUDIENCE:trading-platform}
server:
  address: 0.0.0.0
  port: 8081
  servlet:
    context-path: /api/

service:
  accounts:
    url: ${ACCOUNTS_SERVICE_URL:http://accounts-service:8081/api/accounts}
  instruments:
    url: ${INSTRUMENTS_SERVICE_URL:http://instruments-service:8081/api/instruments}
