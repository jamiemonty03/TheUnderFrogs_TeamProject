spring:
  application:
    name: orders-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.r2dbc.R2dbcAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
server:
  address: 0.0.0.0
  port: 8081
  servlet:
    context-path: /api/
mybatis:
  mapper-locations: classpath:mappers/*.xml
  type-aliases-package: com.neueda.orderservice.models

service:
  accounts:
    url: ${ACCOUNTS_SERVICE_URL:http://accounts-service:8081/api/accounts}
  instruments:
    url: ${INSTRUMENTS_SERVICE_URL:http://instruments-service:8081/api/instruments}
