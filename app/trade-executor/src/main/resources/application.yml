spring:
  application:
    name: trade-executor
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: trade-executor
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: com.neueda.tradeexecutor.events.OrderPlacedEventDeserializer
    listener:
      ack-mode: manual
server:
  address: 0.0.0.0
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

service:
  orders:
    url: ${ORDERS_URL:http://orders-service:8081/api/orders}
  instruments:
    url: ${INSTRUMENTS_URL:http://instruments-service:8081/api/instruments}
  prices:
    url: ${PRICES_URL:http://instruments-service:8081/api}
  accounts:
    url: ${ACCOUNTS_URL:http://accounts-service:8081/api/accounts}
  positions:
    url: ${POSITIONS_URL:http://positions-service:8081/api/positions}

alpaca:
  key-id: ${ALPACA_KEY_ID:}
  secret-key: ${ALPACA_SECRET_KEY:}

market-data:
  poll-interval-ms: ${MARKET_DATA_POLL_INTERVAL_MS:5000}

auth:
  token-url: ${AUTH_TOKEN_URL:http://auth-service:8081/auth/token}
  client-id: ${AUTH_CLIENT_ID:trade-executor}
  client-secret: ${AUTH_CLIENT_SECRET}

