spring:
  application:
    name: positions-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.r2dbc.R2dbcAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  # Tokens are issued by auth-service only. The public key comes from its JWKS endpoint,
  # and every token must carry this issuer and audience.
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://auth-service:8081/.well-known/jwks.json}
          issuer-uri: ${AUTH_ISSUER:auth-service}
          audiences: ${AUTH_AUDIENCE:trading-platform}
server:
  address: 0.0.0.0
  port: 8081
  servlet:
    context-path: /api
