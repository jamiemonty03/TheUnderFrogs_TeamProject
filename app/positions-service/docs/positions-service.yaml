openapi: 3.0.0
info:
  title: Positions Service API
  description: Microservice for portfolio position management and tracking
  version: 1.0.0
  contact:
    name: Neueda LEAP Team
    url: https://github.com/neueda/leap
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: https://positions-service.example.com
    description: Production Server
  - url: http://localhost:8084
    description: Local Development Server

security: []

tags:
  - name: Positions
    description: Position management operations
  - name: Position Queries
    description: Position lookup and retrieval operations
  - name: Portfolios
    description: Named groups of holdings within an account. Cash is shared by the account.

paths:
  /positions:
    post:
      tags:
        - Positions
      summary: Create or update a position
      description: Creates a new position or updates an existing one using insert-or-update logic
      operationId: createPosition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePositionRequest'
            examples:
              success:
                summary: Valid position creation
                value:
                  accountId: "ACC001"
                  portfolioId: "PF0001"
                  symbol: "AAPL"
                  quantity: 100
                  averageCost: 150.50
      responses:
        '200':
          description: Position created or updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Position'
              examples:
                success:
                  summary: Successfully created position
                  value:
                    accountId: "ACC001"
                    portfolioId: "PF0001"
                    symbol: "AAPL"
                    quantity: 100
                    averageCost: 150.50
                    version: 1
                    createdAt: "2026-09-22T10:30:00Z"
                    lastUpdated: "2026-09-22T10:30:00Z"
        '422':
          description: Unprocessable Entity - Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingField:
                  summary: Missing required field
                  value:
                    errorCode: "VAL-422"
                    message: "Account ID cannot be null or blank"
                invalidSymbol:
                  summary: Invalid symbol
                  value:
                    errorCode: "VAL-422"
                    message: "Symbol cannot be null or blank"

  /positions/{accountId}:
    get:
      tags:
        - Position Queries
      summary: Retrieve all positions for an account
      description: Fetches all positions held by a specific account
      operationId: getPositionsByAccount
      parameters:
        - $ref: "#/components/parameters/PortfolioIdQuery"
        - name: accountId
          in: path
          required: true
          description: The unique identifier of the account
          schema:
            type: string
            example: "ACC001"
      responses:
        '200':
          description: Positions retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Position'
              examples:
                success:
                  summary: Account has multiple positions
                  value:
                    - accountId: "ACC001"
                      portfolioId: "PF0001"
                      symbol: "AAPL"
                      quantity: 100
                      averageCost: 150.50
                      version: 1
                      createdAt: "2026-09-22T10:30:00Z"
                      lastUpdated: "2026-09-22T10:30:00Z"
                    - accountId: "ACC001"
                      portfolioId: "PF0001"
                      symbol: "GOOGL"
                      quantity: 25
                      averageCost: 2800.00
                      version: 1
                      createdAt: "2026-09-22T10:35:00Z"
                      lastUpdated: "2026-09-22T10:35:00Z"
                empty:
                  summary: Account has no positions
                  value: []
        '400':
          description: Bad Request - Invalid account ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /positions/{accountId}/{symbol}:
    get:
      tags:
        - Position Queries
      summary: Retrieve a specific position
      description: Fetches position details for a specific account and symbol combination
      operationId: getPosition
      parameters:
        - $ref: "#/components/parameters/PortfolioIdQuery"
        - name: accountId
          in: path
          required: true
          description: The unique identifier of the account
          schema:
            type: string
            example: "ACC001"
        - name: symbol
          in: path
          required: true
          description: The trading symbol (ticker) of the security
          schema:
            type: string
            example: "AAPL"
      responses:
        '200':
          description: Position retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Position'
              examples:
                success:
                  summary: Position found
                  value:
                    accountId: "ACC001"
                    portfolioId: "PF0001"
                    symbol: "AAPL"
                    quantity: 100
                    averageCost: 150.50
                    version: 1
                    createdAt: "2026-09-22T10:30:00Z"
                    lastUpdated: "2026-09-22T10:30:00Z"
        '404':
          description: Position not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  summary: Position does not exist
                  value:
                    errorCode: "POS-404"
                    message: "Position not found for account ACC001 and symbol AAPL"

    put:
      tags:
        - Positions
      summary: Update a position (full update)
      description: Fully updates an existing position with all required fields
      operationId: updatePosition
      parameters:
        - $ref: "#/components/parameters/PortfolioIdQuery"
        - name: accountId
          in: path
          required: true
          description: The unique identifier of the account
          schema:
            type: string
            example: "ACC001"
        - name: symbol
          in: path
          required: true
          description: The trading symbol (ticker) of the security
          schema:
            type: string
            example: "AAPL"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplacePositionRequest'
            examples:
              success:
                summary: Valid position update
                value:
                  quantity: 150
                  averageCost: 152.00
      responses:
        '200':
          description: Position updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Position'
        '404':
          description: Position not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Entity - Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags:
        - Positions
      summary: Partially update a position
      description: Updates selected fields of an existing position
      operationId: partiallyUpdatePosition
      parameters:
        - $ref: "#/components/parameters/PortfolioIdQuery"
        - name: accountId
          in: path
          required: true
          description: The unique identifier of the account
          schema:
            type: string
            example: "ACC001"
        - name: symbol
          in: path
          required: true
          description: The trading symbol (ticker) of the security
          schema:
            type: string
            example: "AAPL"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePositionRequest'
            examples:
              quantityOnly:
                summary: Update quantity only
                value:
                  quantity: 120
              averageCostOnly:
                summary: Update average cost only
                value:
                  averageCost: 155.00
      responses:
        '200':
          description: Position partially updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Position'
        '404':
          description: Position not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Positions
      summary: Delete a position
      description: Removes a position from an account
      operationId: deletePosition
      parameters:
        - $ref: "#/components/parameters/PortfolioIdQuery"
        - name: accountId
          in: path
          required: true
          description: The unique identifier of the account
          schema:
            type: string
            example: "ACC001"
        - name: symbol
          in: path
          required: true
          description: The trading symbol (ticker) of the security
          schema:
            type: string
            example: "AAPL"
      responses:
        '204':
          description: Position deleted successfully (no response body)
        '404':
          description: Position not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /positions/{accountId}/{symbol}/buy:
    post:
      tags:
        - Positions
      summary: Execute a buy operation
      description: >
        Adds shares to an existing position or creates a new position with FIFO average cost calculation.
        When an orderId is sent, the buy is applied at most once for that order: a repeat call returns 200
        with the current position and changes nothing. Without an orderId, every call is applied.
      operationId: buyPosition
      parameters:
        - name: accountId
          in: path
          required: true
          description: The unique identifier of the account
          schema:
            type: string
            example: "ACC001"
        - name: symbol
          in: path
          required: true
          description: The trading symbol (ticker) of the security
          schema:
            type: string
            example: "AAPL"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuyRequest'
            examples:
              success:
                summary: Valid buy order
                value:
                  quantity: 50
                  price: 155.00
              buyForOrder:
                summary: Buy for an order (safe to repeat)
                value:
                  quantity: 50
                  price: 155.00
                  orderId: "0adf7599-df9d-4176-93b6-3a555e54415d"
      responses:
        '200':
          description: Buy operation executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Position'
        '400':
          description: Bad Request - Invalid trade operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Entity - Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /positions/{accountId}/{symbol}/sell:
    post:
      tags:
        - Positions
      summary: Execute a sell operation
      description: >
        Removes shares from an existing position using FIFO method. A position sold down to zero is deleted.
        When an orderId is sent, the sell is applied at most once for that order: a repeat call returns 200
        with the current position (quantity 0 if it was fully sold) and changes nothing.
        Without an orderId, every call is applied.
      operationId: sellPosition
      parameters:
        - name: accountId
          in: path
          required: true
          description: The unique identifier of the account
          schema:
            type: string
            example: "ACC001"
        - name: symbol
          in: path
          required: true
          description: The trading symbol (ticker) of the security
          schema:
            type: string
            example: "AAPL"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SellRequest'
            examples:
              success:
                summary: Valid sell order
                value:
                  quantity: 30
              sellForOrder:
                summary: Sell for an order (safe to repeat)
                value:
                  quantity: 30
                  orderId: "0adf7599-df9d-4176-93b6-3a555e54415d"
      responses:
        '200':
          description: Sell operation executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Position'
        '400':
          description: Bad Request - Insufficient holdings or invalid operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict - Insufficient holdings to complete sale
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Entity - Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /positions/{accountId}/{symbol}/reversal:
    post:
      tags:
        - Positions
      summary: Reverse an order's position movement
      description: >
        Undoes the buy or sell recorded for the given orderId.
        Reversing a buy removes its shares and their cost from the average (the position is deleted if nothing is left).
        Reversing a sell puts the shares back at the average cost recorded at the time of the sale,
        recreating the position if it was fully sold.
        Applied at most once per order: a repeat call returns 200 with the current position and changes nothing.
        If the order has no position movement, nothing is changed and 200 is returned.
      operationId: reversePosition
      parameters:
        - name: accountId
          in: path
          required: true
          description: The unique identifier of the account
          schema:
            type: string
            example: "ACC001"
        - name: symbol
          in: path
          required: true
          description: The trading symbol (ticker) of the security
          schema:
            type: string
            example: "AAPL"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReversalRequest'
            examples:
              reverseOrder:
                summary: Reverse the position movement for an order
                value:
                  orderId: "0adf7599-df9d-4176-93b6-3a555e54415d"
      responses:
        '200':
          description: Movement reversed, already reversed, or nothing to reverse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Position'
        '409':
          description: Conflict - The bought shares have since been sold, so the buy cannot be reversed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Entity - Missing orderId, or the order belongs to a different position
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /portfolios/{accountId}:
    parameters:
      - $ref: "#/components/parameters/AccountIdPath"
    get:
      tags:
        - Portfolios
      summary: List the account's portfolios
      description: Main first, then by name. Creates Main if the account has none yet.
      operationId: getPortfolios
      responses:
        '200':
          description: The account's portfolios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Portfolio'
        '403':
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - Portfolios
      summary: Create a portfolio
      operationId: createPortfolio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePortfolioRequest'
      responses:
        '201':
          description: Portfolio created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Portfolio'
        '403':
          $ref: "#/components/responses/Forbidden"
        '409':
          description: The account already has a portfolio with this name (PFL-409)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Missing or invalid field (VAL-422)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /portfolios/{accountId}/{portfolioId}:
    parameters:
      - $ref: "#/components/parameters/AccountIdPath"
      - name: portfolioId
        in: path
        required: true
        schema:
          type: string
          example: "PF0012"
    get:
      tags:
        - Portfolios
      summary: Get one portfolio
      operationId: getPortfolio
      responses:
        '200':
          description: The portfolio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Portfolio'
        '403':
          $ref: "#/components/responses/Forbidden"
        '404':
          $ref: "#/components/responses/PortfolioNotFound"
    patch:
      tags:
        - Portfolios
      summary: Rename a portfolio or change its risk or benchmark
      operationId: updatePortfolio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePortfolioRequest'
      responses:
        '200':
          description: The updated portfolio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Portfolio'
        '403':
          $ref: "#/components/responses/Forbidden"
        '404':
          $ref: "#/components/responses/PortfolioNotFound"
        '409':
          description: Another portfolio in the account already has this name (PFL-409)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Portfolios
      summary: Delete a portfolio, moving its holdings into Main
      description: >
        Its holdings move into the account's Main portfolio. Where Main already holds the same symbol,
        the two are combined: quantities add up and the average cost becomes the weighted average.
        Main itself can't be deleted.
      operationId: deletePortfolio
      responses:
        '204':
          description: Portfolio deleted
        '403':
          $ref: "#/components/responses/Forbidden"
        '404':
          $ref: "#/components/responses/PortfolioNotFound"
        '409':
          description: It's the Main portfolio (PFL-409)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  parameters:
    AccountIdPath:
      name: accountId
      in: path
      required: true
      description: The signed-in user's account
      schema:
        type: string
        example: "ACC0011"
    PortfolioIdQuery:
      name: portfolioId
      in: query
      required: false
      description: >
        Optional. On the positions list, shows only this portfolio's holdings (all holdings without it).
        On a single position, the portfolio it is in (Main without it).
      schema:
        type: string
        example: "PF0012"

  responses:
    Forbidden:
      description: The account isn't the signed-in user's (AUTH-403)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PortfolioNotFound:
      description: No such portfolio in this account (PFL-404)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    Position:
      type: object
      required:
        - accountId
        - portfolioId
        - symbol
        - quantity
        - averageCost
      properties:
        accountId:
          type: string
          description: The unique identifier of the account holding the position
          example: "ACC001"
        portfolioId:
          type: string
          description: The portfolio this holding belongs to
          example: "PF0001"
        symbol:
          type: string
          description: The trading symbol/ticker of the security
          example: "AAPL"
        quantity:
          type: number
          format: decimal
          description: The number of shares/units held
          example: 100
        averageCost:
          type: number
          format: decimal
          description: The average purchase price per share/unit (FIFO calculated)
          example: 150.50
        version:
          readOnly: true
          type: integer
          description: Set by the server - 0 when created, +1 on every update
          example: 1
        createdAt:
          readOnly: true
          type: string
          format: date-time
          description: Timestamp when the position was created
          example: "2026-09-22T10:30:00Z"
        lastUpdated:
          readOnly: true
          type: string
          format: date-time
          description: Timestamp of the last update to this position
          example: "2026-09-22T10:30:00Z"
        updatedBy:
          readOnly: true
          type: string
          description: Set by the server - the logged-in user, or SYSTEM
          example: "SYSTEM"

    ErrorResponse:
      type: object
      properties:
        errorCode:
          type: string
          description: Unique error code for the error type
          example: "POS-404"
        message:
          type: string
          description: Human-readable error message
          example: "Position not found"
      required:
        - errorCode
        - message

    BuyRequest:
      type: object
      required:
        - quantity
        - price
      properties:
        quantity:
          type: integer
          format: int32
          description: Number of shares to buy
          example: 50
          minimum: 1
        price:
          type: number
          format: decimal
          description: Purchase price per share
          example: 155.00
          minimum: 0.01
        orderId:
          type: string
          description: >
            Optional. The order this buy belongs to. When sent, the buy is applied at most once per order.
          example: "0adf7599-df9d-4176-93b6-3a555e54415d"
        portfolioId:
          type: string
          description: Optional. The portfolio to add the shares to. Without it, the account's Main portfolio.
          example: "PF0012"

    SellRequest:
      type: object
      required:
        - quantity
      properties:
        quantity:
          type: integer
          format: int32
          description: Number of shares to sell
          example: 30
          minimum: 1
        orderId:
          type: string
          description: >
            Optional. The order this sell belongs to. When sent, the sell is applied at most once per order.
          example: "0adf7599-df9d-4176-93b6-3a555e54415d"
        portfolioId:
          type: string
          description: >
            Optional. The portfolio to sell from; only shares held in that portfolio can be sold.
            Without it, the account's Main portfolio.
          example: "PF0012"

    ReversalRequest:
      type: object
      description: Request body for reversing an order's position movement
      required:
        - orderId
      properties:
        orderId:
          type: string
          description: The order whose buy or sell should be reversed
          example: "0adf7599-df9d-4176-93b6-3a555e54415d"

    UpdatePositionRequest:
      type: object
      description: Request body for PATCH operations - all fields are optional
      properties:
        quantity:
          type: number
          format: decimal
          description: Updated quantity of shares held
          example: 120
        averageCost:
          type: number
          format: decimal
          description: Updated average cost per share
          example: 155.00

    CreatePositionRequest:
      type: object
      description: Request body for POST - version, timestamps and updatedBy are set by the server
      required:
        - accountId
        - symbol
        - quantity
        - averageCost
      properties:
        accountId:
          type: string
          example: "ACC001"
        symbol:
          type: string
          example: "AAPL"
        quantity:
          type: number
          format: decimal
          minimum: 0
          example: 100
        averageCost:
          type: number
          format: decimal
          minimum: 0
          example: 150.50
        portfolioId:
          type: string
          description: Optional. Without it, the position goes in the account's Main portfolio.
          example: "PF0012"

    Portfolio:
      type: object
      description: >
        A named group of holdings in one account. All portfolios of an account share its cash.
        Every account has one default portfolio called Main, created the first time it is needed.
      properties:
        portfolioId:
          type: string
          example: "PF0012"
        accountId:
          type: string
          example: "ACC0011"
        name:
          type: string
          example: "Growth"
        risk:
          type: string
          enum: [LOW, MEDIUM, HIGH]
          example: "HIGH"
        benchmark:
          type: string
          nullable: true
          example: "Nasdaq-100"
        defaultPortfolio:
          type: boolean
          description: True for the account's Main portfolio, which can't be deleted
          example: false
        version:
          readOnly: true
          type: integer
          example: 0
        createdAt:
          readOnly: true
          type: string
          format: date-time
        lastUpdated:
          readOnly: true
          type: string
          format: date-time
        updatedBy:
          readOnly: true
          type: string
          example: "SYSTEM"

    CreatePortfolioRequest:
      type: object
      required:
        - name
        - risk
      properties:
        name:
          type: string
          maxLength: 100
          description: Unique within the account, ignoring case
          example: "Growth"
        risk:
          type: string
          enum: [LOW, MEDIUM, HIGH]
          example: "HIGH"
        benchmark:
          type: string
          maxLength: 100
          example: "Nasdaq-100"

    UpdatePortfolioRequest:
      type: object
      description: Every field is optional; only the ones sent are changed
      properties:
        name:
          type: string
          maxLength: 100
          example: "Long-term growth"
        risk:
          type: string
          enum: [LOW, MEDIUM, HIGH]
          example: "MEDIUM"
        benchmark:
          type: string
          maxLength: 100
          example: "S&P 500"

    ReplacePositionRequest:
      type: object
      description: Request body for PUT - the position is identified by the URL
      required:
        - quantity
        - averageCost
      properties:
        quantity:
          type: number
          format: decimal
          minimum: 0
          example: 150
        averageCost:
          type: number
          format: decimal
          minimum: 0
          example: 152.00


