server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;

  resolver 127.0.0.11 valid=10s;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location /auth/ {
    set $upstream auth-service:8081;
    proxy_pass http://$upstream;
  }

  location /api/accounts {
    set $upstream accounts-service:8081;
    proxy_pass http://$upstream;
  }

  location ~ ^/api/(instruments|stocks|bonds|etfs) {
    set $upstream instruments-service:8081;
    proxy_pass http://$upstream;
  }

  location /api/orders {
    set $upstream orders-service:8081;
    proxy_pass http://$upstream;
  }

  location /api/positions {
    set $upstream positions-service:8081;
    proxy_pass http://$upstream;
  }

  location ~* \.(?:js|css|ico|woff2?)$ {
    expires 1y;
    try_files $uri =404;
  }

  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
