<app-auth-layout
  heading="Welcome back"
  subheading="Log in to your Toadstock account."
  activeTab="login"
>
  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (sessionExpired()) {
      <p class="auth-form__notice" role="status" data-testid="login-expired">
        {{ sessionExpiredNotice }}
      </p>
    }

    <label class="auth-form__label" for="login-username">Username</label>
    <mat-form-field appearance="outline" class="auth-form__field">
      <input
        matInput
        id="login-username"
        data-testid="login-username"
        formControlName="username"
        autocomplete="username"
        placeholder="kermit"
      />
      @if (form.controls.username.hasError('required')) {
        <mat-error>Username is required.</mat-error>
      }
    </mat-form-field>

    <label class="auth-form__label" for="login-password">Password</label>
    <mat-form-field appearance="outline" class="auth-form__field">
      <input
        matInput
        id="login-password"
        data-testid="login-password"
        [type]="showPassword() ? 'text' : 'password'"
        formControlName="password"
        autocomplete="current-password"
        placeholder="••••••••"
      />
      <button
        mat-icon-button
        matSuffix
        type="button"
        class="auth-form__reveal"
        data-testid="login-toggle-password"
        [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
        [attr.aria-pressed]="showPassword()"
        (click)="showPassword.set(!showPassword())"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
          <circle cx="12" cy="12" r="3" />
          @if (showPassword()) {
            <path d="M3 3l18 18" />
          }
        </svg>
      </button>
      @if (form.controls.password.hasError('required')) {
        <mat-error>Password is required.</mat-error>
      }
    </mat-form-field>

    @if (errorMessage(); as message) {
      <p class="auth-form__error" role="alert" data-testid="login-error">{{ message }}</p>
    }

    <button
      mat-flat-button
      type="submit"
      class="auth-form__submit"
      [disabled]="submitting()"
      data-testid="login-submit"
    >
      @if (submitting()) {
        Logging in…
      } @else {
        Log in and hop in <span aria-hidden="true">🐸</span>
      }
    </button>
  </form>
</app-auth-layout>
