<header class="nav-bar">
  <div class="nav-bar__top">
    <a class="nav-bar__brand" routerLink="/dashboard" aria-label="UnderFrogs Trade home">
      <img class="nav-bar__brand-mark" src="/brand/toadstock-logo-dark.svg" alt="UnderFrogs logo" />
    </a>

    <button
      mat-icon-button
      type="button"
      class="nav-bar__menu-toggle"
      aria-label="Toggle navigation menu"
      [attr.aria-expanded]="isMenuOpen"
      (click)="toggleMenu()"
    >
      <span class="nav-bar__menu-line"></span>
      <span class="nav-bar__menu-line"></span>
      <span class="nav-bar__menu-line"></span>
    </button>
  </div>

  <div class="nav-bar__content" [class.nav-bar__content--open]="isMenuOpen">
    <nav class="nav-bar__links" aria-label="Primary">
      <a
        class="nav-bar__link"
        routerLink="/dashboard"
        data-testid="nav-dashboard"
        routerLinkActive="nav-bar__link--active"
        (click)="closeMenu()"
        >Dashboard</a
      >
      <a
        class="nav-bar__link"
        routerLink="/instruments"
        data-testid="nav-markets"
        routerLinkActive="nav-bar__link--active"
        (click)="closeMenu()"
        >Markets</a
      >
      <a
        class="nav-bar__link"
        routerLink="/orders"
        data-testid="nav-orders"
        routerLinkActive="nav-bar__link--active"
        (click)="closeMenu()"
        >Orders</a
      >
      <a
        class="nav-bar__link"
        routerLink="/positions"
        data-testid="nav-portfolios"
        routerLinkActive="nav-bar__link--active"
        (click)="closeMenu()"
        >Portfolios</a
      >
    </nav>

    <div class="nav-bar__right">
      <label class="nav-bar__search-wrap" aria-label="Search instruments">
        <input class="nav-bar__search" type="search" placeholder="Search AAPL, SPY, BND..." />
      </label>
      <button
        type="button"
        class="nav-bar__avatar"
        [matMenuTriggerFor]="accountMenu"
        data-testid="account-menu"
        [attr.aria-label]="'Account menu for ' + username()"
      >
        {{ initial() }}
      </button>

      <mat-menu #accountMenu="matMenu" xPosition="before" class="nav-bar__account-menu">
        <div class="nav-bar__account" role="presentation">
          <span class="nav-bar__account-avatar" aria-hidden="true">{{ initial() }}</span>
          <div class="nav-bar__account-details">
            <span class="nav-bar__account-name">{{ username() }}</span>
            <span class="nav-bar__account-role">{{ role() }}</span>
          </div>
        </div>
        <button
          mat-menu-item
          type="button"
          class="nav-bar__wallet"
          (click)="openWallet()"
          data-testid="wallet"
        >
          <svg class="nav-bar__menu-icon" matMenuItemIcon viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 7a2 2 0 0 1 2-2h13v4M3 7v11a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2Z" />
            <path d="M16 14.5h.01" />
          </svg>
          <span>Wallet</span>
        </button>
        <button
          mat-menu-item
          type="button"
          class="nav-bar__logout"
          (click)="logout()"
          data-testid="logout"
        >
          <svg class="nav-bar__menu-icon" matMenuItemIcon viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" />
          </svg>
          <span>Log out</span>
        </button>
      </mat-menu>
    </div>
  </div>
</header>
