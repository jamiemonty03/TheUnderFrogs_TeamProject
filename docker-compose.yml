services:
  postgres:
    image: postgres:15-alpine
    container_name: underfrog-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "0.0.0.0:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema:/docker-entrypoint-initdb.d

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: underfrog-app
    depends_on:
      - postgres
    ports:
      - "8081:8080"

  python:
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: underfrog-python
    depends_on:
      - postgres
    ports:
      - "0.0.0.0:8080:8080"
      # replace with a different port if needed
    volumes:
      - ./db:/db
      - ./.env:/db/.env
    command: python /db/dashboard/dashboard_app.py
  
  

volumes:
  postgres_data:
