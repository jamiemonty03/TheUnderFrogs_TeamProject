services:
  accounts-db:
    image: postgres:15-alpine
    container_name: accounts-db
    env_file: ./app/accounts-service/.env
    entrypoint:
      - sh
      - -c
      - >-
        export POSTGRES_USER="$$SPRING_DATASOURCE_USERNAME"
        export POSTGRES_PASSWORD="$$SPRING_DATASOURCE_PASSWORD"
        export POSTGRES_DB="$${SPRING_DATASOURCE_URL##*/}";
        cp /db/schema/*.sql /docker-entrypoint-initdb.d/;
        cp /load-seed-data.sh /docker-entrypoint-initdb.d/zz-load-seed-data.sh;
        exec docker-entrypoint.sh postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - accounts_db_data:/var/lib/postgresql/data
      - ./app/accounts-service/db:/db:ro
      - ./db/scripts/load-seed-data.sh:/load-seed-data.sh:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$SPRING_DATASOURCE_USERNAME" -d "$${SPRING_DATASOURCE_URL##*/}"']
      interval: 5s
      timeout: 5s
      retries: 10

  accounts-service:
    build:
      context: ./app/accounts-service
      dockerfile: Dockerfile
    container_name: accounts-service
    env_file: ./app/accounts-service/.env
    depends_on:
      accounts-db:
        condition: service_healthy
    ports:
      - "8081:8081"

  instruments-db:
    image: postgres:15-alpine
    container_name: instruments-db
    env_file: ./app/instruments-service/.env
    entrypoint:
      - sh
      - -c
      - >-
        export POSTGRES_USER="$$SPRING_DATASOURCE_USERNAME"
        export POSTGRES_PASSWORD="$$SPRING_DATASOURCE_PASSWORD"
        export POSTGRES_DB="$${SPRING_DATASOURCE_URL##*/}";
        cp /db/schema/*.sql /docker-entrypoint-initdb.d/;
        cp /load-seed-data.sh /docker-entrypoint-initdb.d/zz-load-seed-data.sh;
        exec docker-entrypoint.sh postgres
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - instruments_db_data:/var/lib/postgresql/data
      - ./app/instruments-service/db:/db:ro
      - ./db/scripts/load-seed-data.sh:/load-seed-data.sh:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$SPRING_DATASOURCE_USERNAME" -d "$${SPRING_DATASOURCE_URL##*/}"']
      interval: 5s
      timeout: 5s
      retries: 10

  instruments-service:
    build:
      context: ./app/instruments-service
      dockerfile: Dockerfile
    container_name: instruments-service
    env_file: ./app/instruments-service/.env
    depends_on:
      instruments-db:
        condition: service_healthy
    ports:
      - "8082:8081"

  orders-db:
    image: postgres:15-alpine
    container_name: orders-db
    env_file: ./app/orders-service/.env
    entrypoint:
      - sh
      - -c
      - >-
        export POSTGRES_USER="$$SPRING_DATASOURCE_USERNAME"
        export POSTGRES_PASSWORD="$$SPRING_DATASOURCE_PASSWORD"
        export POSTGRES_DB="$${SPRING_DATASOURCE_URL##*/}";
        cp /db/schema/*.sql /docker-entrypoint-initdb.d/;
        cp /load-seed-data.sh /docker-entrypoint-initdb.d/zz-load-seed-data.sh;
        exec docker-entrypoint.sh postgres
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - orders_db_data:/var/lib/postgresql/data
      - ./app/orders-service/db:/db:ro
      - ./db/scripts/load-seed-data.sh:/load-seed-data.sh:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$SPRING_DATASOURCE_USERNAME" -d "$${SPRING_DATASOURCE_URL##*/}"']
      interval: 5s
      timeout: 5s
      retries: 10

  orders-service:
    build:
      context: ./app/orders-service
      dockerfile: Dockerfile
    container_name: orders-service
    env_file: ./app/orders-service/.env
    depends_on:
      orders-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8083:8081"

  positions-db:
    image: postgres:15-alpine
    container_name: positions-db
    env_file: ./app/positions-service/.env
    entrypoint:
      - sh
      - -c
      - >-
        export POSTGRES_USER="$$SPRING_DATASOURCE_USERNAME"
        export POSTGRES_PASSWORD="$$SPRING_DATASOURCE_PASSWORD"
        export POSTGRES_DB="$${SPRING_DATASOURCE_URL##*/}";
        cp /db/schema/*.sql /docker-entrypoint-initdb.d/;
        cp /load-seed-data.sh /docker-entrypoint-initdb.d/zz-load-seed-data.sh;
        exec docker-entrypoint.sh postgres
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - positions_db_data:/var/lib/postgresql/data
      - ./app/positions-service/db:/db:ro
      - ./db/scripts/load-seed-data.sh:/load-seed-data.sh:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$SPRING_DATASOURCE_USERNAME" -d "$${SPRING_DATASOURCE_URL##*/}"']
      interval: 5s
      timeout: 5s
      retries: 10

  positions-service:
    build:
      context: ./app/positions-service
      dockerfile: Dockerfile
    container_name: positions-service
    env_file: ./app/positions-service/.env
    depends_on:
      positions-db:
        condition: service_healthy
    ports:
      - "8084:8081"
  
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "127.0.0.1:9094:9094" 
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    
  kafka-init:
    image: apache/kafka:3.9.1
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["bash", "/create-topics.sh"]
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8086:8086"  
    environment:
      SERVER_PORT: 8086
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  trade-executor:
    build:
      context: ./app/trade-executor
      dockerfile: Dockerfile
    container_name: trade-executor
    env_file:
      - path: ./app/trade-executor/.env
        required: false

    depends_on:
      kafka-init:
        condition: service_completed_successfully
      orders-service:
        condition: service_started
      instruments-service:
        condition: service_started

  python:
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: underfrog-python
    env_file: ./app/instruments-service/.env
    depends_on:
      instruments-db:
        condition: service_healthy
    ports:
      - "0.0.0.0:8085:8080"
    volumes:
      - ./db:/db
      - ./app/instruments-service/db/etl:/db/etl
      - ./app/instruments-service/db/schema:/db/schema:ro
    command: python /db/dashboard/dashboard_app.py

volumes:
  accounts_db_data:
  instruments_db_data:
  orders_db_data:
  positions_db_data:
