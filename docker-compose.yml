x-java-memory: &java-memory
  mem_limit: 512m
  restart: unless-stopped

x-java-env: &java-env
  JAVA_TOOL_OPTIONS: >-
    -XX:MaxRAMPercentage=70
    -XX:MaxMetaspaceSize=192m
    -XX:+ExitOnOutOfMemoryError
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 5

services:
  accounts-db:
    image: postgres:15-alpine
    container_name: accounts-db
    mem_limit: 256m
    env_file: ./app/accounts-service/.env
    entrypoint:
      - sh
      - -c
      - >-
        export POSTGRES_USER="$$SPRING_DATASOURCE_USERNAME"
        export POSTGRES_PASSWORD="$$SPRING_DATASOURCE_PASSWORD"
        export POSTGRES_DB="$${SPRING_DATASOURCE_URL##*/}";
        cp /db/schema/*.sql /docker-entrypoint-initdb.d/;
        cp /load-seed-data.sh /docker-entrypoint-initdb.d/zz-load-seed-data.sh;
        exec docker-entrypoint.sh postgres -c shared_buffers=64MB -c max_connections=30 -c work_mem=4MB
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - accounts_db_data:/var/lib/postgresql/data
      - ./app/accounts-service/db:/db:ro
      - ./db/scripts/load-seed-data.sh:/load-seed-data.sh:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$SPRING_DATASOURCE_USERNAME" -d "$${SPRING_DATASOURCE_URL##*/}"']
      interval: 5s
      timeout: 5s
      retries: 10

  accounts-service:
    build:
      context: ./app/accounts-service
      dockerfile: Dockerfile
    container_name: accounts-service
    <<: *java-memory
    environment:
      <<: *java-env
    env_file: ./app/accounts-service/.env
    depends_on:
      accounts-db:
        condition: service_healthy
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/api/v3/api-docs || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  instruments-db:
    image: postgres:15-alpine
    container_name: instruments-db
    mem_limit: 256m
    env_file: ./app/instruments-service/.env
    entrypoint:
      - sh
      - -c
      - >-
        export POSTGRES_USER="$$SPRING_DATASOURCE_USERNAME"
        export POSTGRES_PASSWORD="$$SPRING_DATASOURCE_PASSWORD"
        export POSTGRES_DB="$${SPRING_DATASOURCE_URL##*/}";
        cp /db/schema/*.sql /docker-entrypoint-initdb.d/;
        cp /load-seed-data.sh /docker-entrypoint-initdb.d/zz-load-seed-data.sh;
        exec docker-entrypoint.sh postgres -c shared_buffers=64MB -c max_connections=30 -c work_mem=4MB
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - instruments_db_data:/var/lib/postgresql/data
      - ./app/instruments-service/db:/db:ro
      - ./db/scripts/load-seed-data.sh:/load-seed-data.sh:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$SPRING_DATASOURCE_USERNAME" -d "$${SPRING_DATASOURCE_URL##*/}"']
      interval: 5s
      timeout: 5s
      retries: 10

  instruments-service:
    build:
      context: ./app/instruments-service
      dockerfile: Dockerfile
    container_name: instruments-service
    <<: *java-memory
    environment:
      <<: *java-env
    env_file: ./app/instruments-service/.env
    depends_on:
      instruments-db:
        condition: service_healthy
    ports:
      - "8082:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/api/v3/api-docs || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  orders-db:
    image: postgres:15-alpine
    container_name: orders-db
    mem_limit: 256m
    env_file: ./app/orders-service/.env
    entrypoint:
      - sh
      - -c
      - >-
        export POSTGRES_USER="$$SPRING_DATASOURCE_USERNAME"
        export POSTGRES_PASSWORD="$$SPRING_DATASOURCE_PASSWORD"
        export POSTGRES_DB="$${SPRING_DATASOURCE_URL##*/}";
        cp /db/schema/*.sql /docker-entrypoint-initdb.d/;
        cp /load-seed-data.sh /docker-entrypoint-initdb.d/zz-load-seed-data.sh;
        exec docker-entrypoint.sh postgres -c shared_buffers=64MB -c max_connections=30 -c work_mem=4MB
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - orders_db_data:/var/lib/postgresql/data
      - ./app/orders-service/db:/db:ro
      - ./db/scripts/load-seed-data.sh:/load-seed-data.sh:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$SPRING_DATASOURCE_USERNAME" -d "$${SPRING_DATASOURCE_URL##*/}"']
      interval: 5s
      timeout: 5s
      retries: 10

  orders-service:
    build:
      context: ./app/orders-service
      dockerfile: Dockerfile
    container_name: orders-service
    <<: *java-memory
    env_file: ./app/orders-service/.env
    environment:
      <<: *java-env
      SPRING_PROFILES_ACTIVE: json-logs
    depends_on:
      orders-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8083:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/api/v3/api-docs || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  positions-db:
    image: postgres:15-alpine
    container_name: positions-db
    mem_limit: 256m
    env_file: ./app/positions-service/.env
    entrypoint:
      - sh
      - -c
      - >-
        export POSTGRES_USER="$$SPRING_DATASOURCE_USERNAME"
        export POSTGRES_PASSWORD="$$SPRING_DATASOURCE_PASSWORD"
        export POSTGRES_DB="$${SPRING_DATASOURCE_URL##*/}";
        cp /db/schema/*.sql /docker-entrypoint-initdb.d/;
        cp /load-seed-data.sh /docker-entrypoint-initdb.d/zz-load-seed-data.sh;
        exec docker-entrypoint.sh postgres -c shared_buffers=64MB -c max_connections=30 -c work_mem=4MB
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - positions_db_data:/var/lib/postgresql/data
      - ./app/positions-service/db:/db:ro
      - ./db/scripts/load-seed-data.sh:/load-seed-data.sh:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$SPRING_DATASOURCE_USERNAME" -d "$${SPRING_DATASOURCE_URL##*/}"']
      interval: 5s
      timeout: 5s
      retries: 10

  positions-service:
    build:
      context: ./app/positions-service
      dockerfile: Dockerfile
    container_name: positions-service
    <<: *java-memory
    environment:
      <<: *java-env
    env_file: ./app/positions-service/.env
    depends_on:
      positions-db:
        condition: service_healthy
    ports:
      - "8084:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/api/v3/api-docs || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "127.0.0.1:9094:9094" 
    container_name: kafka
    mem_limit: 1g
    restart: unless-stopped
    environment:
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    
  kafka-init:
    image: apache/kafka:3.9.1
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["bash", "/create-topics.sh"]
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    mem_limit: 384m
    ports:
      - "8086:8086"  
    environment:
      SERVER_PORT: 8086
      JAVA_OPTS: "-XX:MaxRAMPercentage=70 -XX:MaxMetaspaceSize=128m"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  auth-db:
    image: postgres:15-alpine
    container_name: auth-db
    mem_limit: 256m
    env_file: ./app/auth-service/.env
    entrypoint:
      - sh
      - -c
      - >-
        export POSTGRES_USER="$$DB_USERNAME"
        export POSTGRES_PASSWORD="$$DB_PASSWORD"
        export POSTGRES_DB="$$DB_NAME";
        cp /db/schema/*.sql /docker-entrypoint-initdb.d/;
        cp /load-seed-data.sh /docker-entrypoint-initdb.d/zz-load-seed-data.sh;
        exec docker-entrypoint.sh postgres -c shared_buffers=64MB -c max_connections=30 -c work_mem=4MB
    ports:
      - "127.0.0.1:5438:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
      - ./app/auth-service/db:/db:ro
      - ./db/scripts/load-seed-data.sh:/load-seed-data.sh:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$DB_USERNAME" -d "$$DB_NAME"']
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: ./app/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    mem_limit: 256m
    env_file: ./app/auth-service/.env
    environment:
      DB_HOST: auth-db
      DB_PORT: 5432
    depends_on:
      auth-db:
        condition: service_healthy
    ports:
      - "8087:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  trade-executor:
    build:
      context: ./app/trade-executor
      dockerfile: Dockerfile
    container_name: trade-executor
    <<: *java-memory
    environment:
      <<: *java-env
    env_file:
      - path: ./app/trade-executor/.env
        required: false
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      orders-service:
        condition: service_healthy
      instruments-service:
        condition: service_healthy
      accounts-service:
        condition: service_healthy
      positions-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  python:
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: underfrog-python
    mem_limit: 512m
    env_file: 
      - ./app/instruments-service/.env
      - ./app/trade-analytics-service/.env
    depends_on:
      instruments-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      trade-analytics-db:
        condition: service_healthy
    ports:
      - "0.0.0.0:8085:8080"
    volumes:
      - ./db:/db
      - ./app/instruments-service/db/etl:/db/etl
      - ./app/instruments-service/db/schema:/db/schema:ro
      - ./app/instruments-service/db/tests:/db/tests

  sonarqube:
    image: sonarqube:9.9.0-community
    container_name: sonarqube
    mem_limit: 2g
    profiles: [quality]
    ports:
      - "0.0.0.0:8088:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLED: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

  trade-analytics-db:
    image: postgres:15-alpine
    container_name: trade-analytics-db
    mem_limit: 256m
    env_file:
      - path: ./app/trade-analytics-service/.env
        required: false
    entrypoint:
      - sh
      - -c
      - >-
        export POSTGRES_USER="$$ANALYTICS_DB_USERNAME"
        export POSTGRES_PASSWORD="$$ANALYTICS_DB_PASSWORD"
        export POSTGRES_DB="$${ANALYTICS_DB_URL##*/}";
        cp /db/schema/*.sql /docker-entrypoint-initdb.d/;
        exec docker-entrypoint.sh postgres -c shared_buffers=64MB -c max_connections=30 -c work_mem=4MB
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - trade_analytics_db_data:/var/lib/postgresql/data
      - ./app/trade-analytics-service/db:/db:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$ANALYTICS_DB_USERNAME" -d "$${ANALYTICS_DB_URL##*/}"']
      interval: 5s
      timeout: 5s
      retries: 10

  trade-analytics-service:
    build:
      context: ./app/trade-analytics-service
      dockerfile: Dockerfile
    container_name: trade-analytics-service
    mem_limit: 256m
    env_file:
      - path: ./app/trade-analytics-service/.env
        required: false
    depends_on:
      orders-db:
        condition: service_healthy
      accounts-db:
        condition: service_healthy
      instruments-db:
        condition: service_healthy
      trade-analytics-db:
        condition: service_healthy

volumes:
  accounts_db_data:
  instruments_db_data:
  orders_db_data:
  positions_db_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  trade_analytics_db_data:
  auth_db_data:
