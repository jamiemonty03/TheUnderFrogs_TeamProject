services:
  postgres:
    image: postgres:15-alpine
    container_name: underfrog-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "0.0.0.0:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema:/docker-entrypoint-initdb.d

  accounts-service:
    build:
      context: ./app/accounts-service
      dockerfile: Dockerfile
    container_name: accounts-service
    depends_on:
      - postgres
    ports:
      - "8081:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}

  instruments-service:
    build:
      context: ./app/instruments-service
      dockerfile: Dockerfile
    container_name: instruments-service
    depends_on:
      - postgres
    ports:
      - "8082:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}

  orders-service:
    build:
      context: ./app/orders-service
      dockerfile: Dockerfile
    container_name: orders-service
    depends_on:
      - postgres
    ports:
      - "8083:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}

  positions-service:
    build:
      context: ./app/positions-service
      dockerfile: Dockerfile
    container_name: positions-service
    depends_on:
      - postgres
    ports:
      - "8084:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}

  python:
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: underfrog-python
    depends_on:
      - postgres
    ports:
      - "0.0.0.0:8080:8080"
      # replace with a different port if needed
    volumes:
      - ./db:/db
      - ./.env:/db/.env
    command: python /db/dashboard/dashboard_app.py
  
  

volumes:
  postgres_data:
